<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CGV - Hồ sơ cá nhân</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth-layout.css">
    <link rel="stylesheet" href="css/hosocanhan.css">

</head>

<body>

    <div class="page-wrap">
      <div class="top-ad">
        <img src="https://www.cgv.vn/media/wysiwyg/2025/06/980x80.jpg" alt="CGV Banner">
      </div>
      <div id="site-header-host"></div>

    <main class="profile-section py-5">
      <div class="container">
        <h2 class="profile-title">HỒ SƠ CÁ NHÂN</h2>
        <div class="row justify-content-center">
          <div class="col-12 col-lg-10">
            <div class="card profile-card border-0 shadow-sm">
              <div class="card-body p-4 p-md-5">
                <div class="row g-4 align-items-center">
                  <div class="col-12 col-md-4 text-center">
                    <img id="profile-avatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="avatar img-fluid rounded-circle mb-3" alt="Avatar">
                    <h5 class="mb-1">Gold Member</h5>
                                        <p class="member mb-0"><span id="profile-points">1250</span> CGV Point</p>
                  </div>
                  <div class="col-12 col-md-8">
                    <form id="profile-form">
                      <div class="form-floating mb-3">
                        <input id="name" type="text" class="form-control" placeholder="Họ và tên">
                        <label for="name">Họ và tên</label>
                      </div>

                      <div class="form-floating mb-3">
                        <input id="email" type="email" class="form-control" placeholder="Email">
                        <label for="email">Email</label>
                      </div>

                      <div class="form-floating mb-3">
                        <input id="phone" type="tel" class="form-control" placeholder="Số điện thoại">
                        <label for="phone">Số điện thoại</label>
                      </div>

                      <div class="mb-3">
                        <input id="dob" type="date" class="form-control">
                      </div>

                      <div class="mb-3">
                        <select id="gender" class="form-select">
                          <option selected disabled>Chọn giới tính</option>
                          <option>Nam</option>
                          <option>Nữ</option>
                          <option>Khác</option>
                        </select>
                      </div>

                      <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary">CẬP NHẬT</button>
                        <a href="vecuatoi.html" class="btn btn-outline-secondary">VÉ CỦA TÔI</a>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

n    <div id="site-footer-host"></div>

n    </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script>
  // Populate profile form from storage and save on submit
  document.addEventListener('DOMContentLoaded', function(){
    try {
      const user = getUser();
      document.getElementById('name').value = user.name || '';
      document.getElementById('email').value = user.email || '';
      document.getElementById('phone').value = user.phone || '';
      if (user.dob) document.getElementById('dob').value = user.dob;
      if (user.gender) document.getElementById('gender').value = user.gender;
      const avatarEl = document.getElementById('profile-avatar');
      if (avatarEl && user.avatarUrl) avatarEl.src = user.avatarUrl;
      const pointsEl = document.getElementById('profile-points');
      if (pointsEl) pointsEl.textContent = user.points || 0;
    } catch (err) {
      console.error('Failed to load profile', err);
    }

    const form = document.getElementById('profile-form');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      const updated = {
        name: document.getElementById('name').value || '',
        email: document.getElementById('email').value || '',
        phone: document.getElementById('phone').value || '',
        dob: document.getElementById('dob').value || '',
        gender: document.getElementById('gender').value || '',
        // keep existing avatar/points if not changed
      };
      const saved = saveUser(Object.assign({}, getUser(), updated));
      // update UI
      const pointsEl = document.getElementById('profile-points');
      if (pointsEl) pointsEl.textContent = saved.points || 0;
      showToast('Cập nhật thông tin thành công!');
    });
  });
  </script>
</body>

</html>
