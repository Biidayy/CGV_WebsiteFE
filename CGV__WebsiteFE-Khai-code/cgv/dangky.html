<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGV - Đăng ký</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth-layout.css">
    <link rel="stylesheet" href="css/dangky.css">
</head>

<body>

    <div class="page-wrap">
      <div class="top-ad">
        <img src="https://www.cgv.vn/media/wysiwyg/2025/06/980x80.jpg" alt="CGV Banner">
      </div>
      <div id="site-header-host"></div>

    <!-- Nội dung -->
    <main>

        <div class="register-container">

            <div class="register-box">
              <div class="card register-card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                  <div class="text-center mb-3">
                    <img src="https://www.cgv.vn/skin/frontend/cgv/default/images/cgvlogo.png" class="login-logo img-fluid" alt="CGV">
                  </div>

                  <h3 class="text-center fw-bold text-uppercase mb-4">Đăng ký tài khoản</h3>

                  <form>
                    <div class="form-floating mb-3">
                      <input id="name" type="text" class="form-control" placeholder="Họ và tên" required>
                      <label for="name">Họ và tên</label>
                    </div>

                    <div class="form-floating mb-3">
                      <input id="email" type="email" class="form-control" placeholder="Email" required>
                      <label for="email">Email</label>
                    </div>

                    <div class="form-floating mb-3">
                      <input id="phone" type="tel" class="form-control" placeholder="Số điện thoại" required>
                      <label for="phone">Số điện thoại</label>
                    </div>

                    <div class="mb-3">
                      <input id="dob" type="date" class="form-control" required>
                    </div>

                    <div class="mb-3">
                      <select id="gender" class="form-select" required>
                        <option value="">Giới tính</option>
                        <option>Nam</option>
                        <option>Nữ</option>
                        <option>Khác</option>
                      </select>
                    </div>

                    <div class="form-floating mb-3">
                      <input id="password" type="password" class="form-control" placeholder="Mật khẩu" required>
                      <label for="password">Mật khẩu</label>
                    </div>

                    <div class="form-floating mb-3">
                      <input id="password2" type="password" class="form-control" placeholder="Xác nhận mật khẩu" required>
                      <label for="password2">Xác nhận mật khẩu</label>
                    </div>

                    <div class="form-check mb-3">
                      <input class="form-check-input" type="checkbox" id="agree">
                      <label class="form-check-label small text-muted" for="agree">Tôi đồng ý với điều khoản sử dụng</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">ĐĂNG KÝ</button>

                    <p class="text-center small mb-0">Đã có tài khoản? <a href="dangnhap.html">Đăng nhập</a></p>
                  </form>
                </div>
              </div>
            </div>

        </div>

    </main>

    <div id="site-footer-host"></div>

    </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
