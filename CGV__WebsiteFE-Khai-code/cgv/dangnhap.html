<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CGV - Đăng nhập</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth-layout.css">
    <link rel="stylesheet" href="css/dangnhap.css">

</head>

<body>

    <!-- Banner -->

    <div class="page-wrap">
      <div class="top-ad">
        <img src="https://www.cgv.vn/media/wysiwyg/2025/06/980x80.jpg" alt="CGV Banner">
      </div>
      <div id="site-header-host"></div>

    <main class="login-section py-5">

        <div class="container">

            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                    <div class="card login-card border-0 shadow-sm">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-3">
                                <img src="https://www.cgv.vn/skin/frontend/cgv/default/images/cgvlogo.png" alt="CGV" class="login-logo img-fluid">
                            </div>

                            <h3 class="text-center fw-bold text-uppercase mb-4">Đăng nhập</h3>

                            <form>
                                <div class="form-floating mb-3">
                                    <input id="email" type="email" class="form-control" placeholder="Email" required>
                                    <label for="email">Email</label>
                                </div>

                                <div class="form-floating mb-3">
                                    <input id="password" type="password" class="form-control" placeholder="Mật khẩu" required>
                                    <label for="password">Mật khẩu</label>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="remember">
                                        <label class="form-check-label small text-muted" for="remember">Ghi nhớ đăng nhập</label>
                                    </div>

                                    <a href="#" class="small text-muted">Quên mật khẩu?</a>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 mb-3">ĐĂNG NHẬP</button>

                                <p class="text-center small mb-0">Chưa có tài khoản? <a href="dangky.html">Đăng ký ngay</a></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <div id="site-footer-host"></div>

    </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
