<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký | CGV Cinemas</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dangky.css">
</head>
<body data-active="account">
  <div class="page-wrap">
    <div id="site-header-host"></div>

    <nav class="breadcrumbs">
      <a href="index.html">Trang Chủ</a><span>/</span>
      Đăng Ký
    </nav>

    <main class="login-page">
      <section class="login-card">
        <div class="login-card__header">
          <h1>Đăng ký tài khoản</h1>
          <p>Tạo tài khoản để mua vé, theo dõi lịch sử đặt vé và lưu phim yêu thích.</p>
        </div>

        <form class="login-form">
          <label class="field">
            <span>Họ và tên</span>
            <input type="text" placeholder="Nhập họ và tên">
          </label>

          <label class="field">
            <span>Email</span>
            <input type="email" placeholder="Nhập email">
          </label>

          <label class="field">
            <span>Số điện thoại</span>
            <input type="tel" placeholder="Nhập số điện thoại">
          </label>

          <label class="field">
            <span>Mật khẩu</span>
            <input type="password" placeholder="Nhập mật khẩu">
          </label>

          <label class="field">
            <span>Xác nhận mật khẩu</span>
            <input type="password" placeholder="Nhập lại mật khẩu">
          </label>

          <button class="btn-submit" type="submit">Đăng ký</button>
        </form>

        <p class="login-footer">Đã có tài khoản? <a href="dangnhap.html">Đăng nhập</a></p>
      </section>
    </main>

    <div id="site-footer-host"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
