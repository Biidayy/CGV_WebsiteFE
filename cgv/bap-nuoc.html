<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bắp Nước & Combo - CGV Cinemas</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background-color: #fdfcf0; font-family: Arial, sans-serif; }
    .combo-container { max-width: 900px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .combo-header { border-bottom: 2px solid #e71a0f; padding-bottom: 10px; color: #e71a0f; }
    .combo-item { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding: 15px 0; }
    .combo-info h4 { margin: 0 0 5px 0; color: #222; }
    .price { color: #e71a0f; font-weight: bold; }
    .btn-qty { background: #e71a0f; color: #fff; border: none; padding: 5px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="combo-container">
    <h2 class="combo-header">🍿 BẮP NƯỚC & COMBO CGV 🍿</h2>
    <div class="combo-item">
      <div class="combo-info">
        <h4>CGV Solo Combo</h4>
        <p>1 Bắp Lớn + 1 Nước Siêu Lớn</p>
        <span class="price">89.000 VNĐ</span>
      </div>
      <div>
        <button class="btn-qty">-</button>
        <span style="margin: 0 10px; font-weight: bold;">1</span>
        <button class="btn-qty">+</button>
      </div>
    </div>
  </div>
</body>
</html>
