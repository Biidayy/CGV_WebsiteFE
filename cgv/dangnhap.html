<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | CGV Cinemas</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dangnhap.css">
</head>
<body data-active="account">
  <div class="page-wrap">
    <div id="site-header-host"></div>

    <nav class="breadcrumbs">
      <a href="index.html">Trang Chủ</a><span>/</span>
      Đăng Nhập
    </nav>

    <main class="login-page">
      <section class="login-card">
        <div class="login-card__header">
          <h1>Đăng nhập</h1>
          <p>Đăng nhập để mua vé, xem vé của bạn và lưu phim yêu thích.</p>
        </div>

        <form class="login-form">
          <label class="field">
            <span>Email hoặc số điện thoại</span>
            <input type="text" placeholder="Nhập email hoặc số điện thoại">
          </label>

          <label class="field">
            <span>Mật khẩu</span>
            <input type="password" placeholder="Nhập mật khẩu">
          </label>

          <div class="login-row">
            <label class="checkbox">
              <input type="checkbox">
              <span>Ghi nhớ</span>
            </label>
            <a href="#">Quên mật khẩu?</a>
          </div>

          <button class="btn-submit" type="submit">Đăng nhập</button>
        </form>

        <p class="login-footer">Chưa có tài khoản? <a href="dangky.html">Đăng ký ngay</a></p>
      </section>
    </main>

    <div id="site-footer-host"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
